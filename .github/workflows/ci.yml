name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command composer install --no-interaction --no-progress
      - run: nix develop --command vendor/bin/phpunit

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build dev environment
        run: nix build .#dev --no-link
      - name: Start stack
        run: nix run .#dev -- --tui=false > dev.log 2>&1 &
      - name: Smoke test
        run: tests/smoke.sh
      - name: Logs on failure
        if: failure()
        run: cat dev.log
      - name: Stop stack
        if: always()
        run: nix develop --command process-compose down --port 8090 || true
