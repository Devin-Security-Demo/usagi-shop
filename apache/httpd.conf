# Apache httpd for the Nix dev environment (`nix run`).
# @httpd@ / @php@ are substituted by Nix; ${APP_ROOT}, ${STATE_DIR} and
# ${APP_PORT} are read from the environment at startup.
ServerRoot "@httpd@"
ServerName localhost
ServerAdmin webmaster@usagi.example
Listen 127.0.0.1:${APP_PORT}
PidFile "${STATE_DIR}/httpd/httpd.pid"
DefaultRuntimeDir "${STATE_DIR}/httpd"

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule logio_module modules/mod_logio.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php_module @php@/modules/libphp.so
PHPIniDir "@php@/etc"

ErrorLog /dev/stderr
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /dev/stdout combined
TypesConfig conf/mime.types

<FilesMatch ".+\.ph(ar|p|tml)$">
    SetHandler application/x-httpd-php
</FilesMatch>

<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

DocumentRoot "${APP_ROOT}/public"

<Directory "${APP_ROOT}">
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>

<Directory "${APP_ROOT}/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

<Directory "${APP_ROOT}/public/uploads">
    php_admin_flag engine off
    <FilesMatch "\.(?i:php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

ErrorDocument 404 /404.php
